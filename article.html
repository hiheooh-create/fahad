      const scriptSrc = 'https://afders.org/1/25c7fbe2b3a72df08d5b3552e4b12de4';
      try {
        const lastLoad = Number(localStorage.getItem(storageKey) || 0);
        if (Date.now() - lastLoad >= window.AD_LIMIT_WINDOW_MS) {
          localStorage.setItem(storageKey, String(Date.now()));
          const script = document.createElement('script');
          script.dataset.cfasync = 'false';
          script.src = scriptSrc;
          document.head.appendChild(script);
        }
      } catch (error) {
        console.warn('Ad frequency cap could not be stored.', error);
      }
    })();
